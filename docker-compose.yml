services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoopslab}
      POSTGRES_USER: ${POSTGRES_USER:-hoopslab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoopslab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoopslab} -d ${POSTGRES_DB:-hoopslab}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    volumes:
      - hoopslab-postgres:/var/lib/postgresql/data

volumes:
  hoopslab-postgres:
